<?xml version="1.0" encoding="UTF-8"?>
<!-- snurra: a record, spinning (Swedish "snurra", to spin, as a record does). -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
	<!-- The record. -->
	<circle cx="32" cy="32" r="30" fill="#1d1f23"/>
	<!-- Its grooves, catching the light on one side. -->
	<g fill="none" stroke="#3a3e46" stroke-width="1">
		<circle cx="32" cy="32" r="26"/>
		<circle cx="32" cy="32" r="22.5"/>
		<circle cx="32" cy="32" r="19"/>
	</g>
	<path d="M 32 4 A 28 28 0 0 1 58.6 23.3" fill="none" stroke="#8a93a3" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
	<path d="M 32 60 A 28 28 0 0 1 5.4 40.7" fill="none" stroke="#8a93a3" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
	<!-- The label and its hole. -->
	<circle cx="32" cy="32" r="11" fill="#e8743b"/>
	<path d="M 32 21 A 11 11 0 0 1 43 32 L 32 32 Z" fill="#f4a261"/>
	<circle cx="32" cy="32" r="2.2" fill="#1d1f23"/>
</svg>
